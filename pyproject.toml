[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wordcard"
version = "0.1.0"
description = "英语单词默写纸：读单词表 CSV，生成可打印 A4 默写卡与答案页"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "english", "vocabulary", "teacher", "printable", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
wordcard = "wordcard.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/wordcard"
Source = "https://github.com/eastyou/wordcard"

[tool.setuptools]
packages = ["wordcard"]
